<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#EEE9E0;font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#E3C78A}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.kick{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#D2B272}
.top{display:flex;justify-content:space-between;align-items:center;height:80px;border-bottom:1px solid rgba(238,233,224,.08)}
.top img{height:40px;width:auto;display:block}
.top a.back{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:#B9B2A5}
.hero{padding:56px 0 32px;text-align:center}
.check{width:64px;height:64px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;background:radial-gradient(circle,rgba(227,199,138,.25),rgba(227,199,138,.05));box-shadow:0 0 0 1px rgba(227,199,138,.5)}
.check svg{width:30px;height:30px;color:#E3C78A}
h1{font-size:52px;line-height:1.05;margin:12px 0 0}
.sub{font-size:17px;line-height:1.6;color:#B9B2A5;max-width:560px;margin:16px auto 0}
.meta{display:flex;justify-content:center;gap:10px 24px;flex-wrap:wrap;margin-top:22px;font-size:13px;color:#9A948A}
.meta b{color:#EEE9E0;font-weight:600}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:30px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:6px;font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:0;font-family:inherit}
.btn-gold{color:#130D03;background:linear-gradient(180deg,#F6E4B0 0%,#E0BE74 48%,#B98F45 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 16px 36px -16px rgba(214,178,104,.85)}
.btn-line{background:transparent;color:#EEE9E0;border:1px solid rgba(227,199,138,.5)}
.btn-line:hover{border-color:#E3C78A}
.btn svg{width:16px;height:16px}
h2{font-size:32px;margin:48px 0 18px}
.tickets{display:flex;flex-direction:column;gap:18px}
.tk{display:grid;grid-template-columns:minmax(0,1fr) 220px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#17140F,#0D0C0A);box-shadow:0 0 0 1px rgba(227,199,138,.4);position:relative}
.tk__main{padding:28px 30px;display:flex;flex-direction:column;gap:14px;border-right:2px dashed rgba(227,199,138,.3)}
.tk__head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tk__head img{height:30px;width:auto}
.badge{font-size:11px;font-weight:800;letter-spacing:.16em;padding:6px 10px;border-radius:4px;color:#130D03;background:linear-gradient(180deg,#F6E4B0,#D9B46A);text-transform:uppercase}
.tk__city{font-size:44px;line-height:1}
.tk__when{font-size:15px;color:#D7D0C3;line-height:1.5}
.tk__grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin-top:4px}
.tk__grid div span{display:block;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8F8A80;margin-bottom:4px}
.tk__grid div b{font-size:15px;font-weight:600;color:#F2EEE6;word-break:break-word}
.tk__qr{padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#F7F2E7;color:#130D03;text-align:center}
.tk__qr .qr{width:170px;height:170px}
.tk__qr .qr svg{width:100%;height:100%;display:block}
.tk__qr small{font-size:11px;line-height:1.35;color:#5A5348}
.tk__qr code{font-size:13px;font-weight:800;letter-spacing:.08em}
.tk__print{align-self:flex-start;font-size:11px;padding:0 14px;min-height:40px;margin-top:4px}
.box{margin-top:18px;border-radius:12px;padding:26px 28px;background:#0F0E0C;box-shadow:0 0 0 1px rgba(238,233,224,.08)}
.deliv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.deliv li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid rgba(238,233,224,.08)}
.deliv li:first-child{border-top:0}
.deliv b{font-weight:600}
.deliv p{margin:4px 0 0;font-size:13px;color:#9A948A}
.deliv a{flex:none}
.muted{color:#9A948A;font-size:14px;line-height:1.6;margin:0}
.state{padding:120px 0;text-align:center;color:#B9B2A5;font-size:17px}
.warn{margin:20px auto 0;max-width:640px;padding:14px 16px;border-radius:8px;background:rgba(224,121,107,.1);border:1px solid rgba(224,121,107,.45);color:#F0B0A6;text-align:center}
.foot{margin:56px 0 40px;text-align:center;font-size:14px;color:#8F8A80}
.foot a{text-decoration:none}
@media (max-width:720px){
 h1{font-size:38px}
 .tk{grid-template-columns:1fr}
 .tk__main{border-right:0;border-bottom:2px dashed rgba(227,199,138,.3);padding:22px}
 .tk__city{font-size:36px}
 .deliv li{flex-direction:column;align-items:flex-start}
}
@media print{
 @page{margin:12mm}
 body{background:#fff;color:#111}
 .top,.hero .actions,.no-print,.foot,.tk__print,h2.no-print{display:none !important}
 .hero{padding:0 0 10px}
 .check{display:none}
 h1{font-size:26px;color:#111}
 .sub,.meta{color:#333}
 .meta b{color:#111}
 .tk{break-inside:avoid;page-break-inside:avoid;margin-bottom:14px;box-shadow:0 0 0 1px #999;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .tk__main{border-right:2px dashed #999}
 .tk__city,.tk__grid div b,.tk__when{color:#111}
 .tk__head img{filter:none}
 body.print-one .tk:not(.print-me){display:none}
 .box{display:none}
}
</style>
</head>
